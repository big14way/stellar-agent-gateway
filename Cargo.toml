[workspace]
resolver = "2"
members = [
    "contracts/service-registry",
    "contracts/smart-account",
    "crates/shared",
    "crates/x402-services",
    "crates/mcp-server",
]
default-members = [
    "crates/shared",
    "crates/x402-services",
    "crates/mcp-server",
]

[workspace.dependencies]
soroban-sdk        = "23.5.3"
stellar-accounts   = "=0.6.0"
# stellar-xdr MUST be pinned to =23.0.0 — soroban-sdk 23.5.3 depends on exactly this version.
# Using any other version causes duplicate type errors.
stellar-xdr        = { version = "=23.0.0", default-features = false, features = ["curr", "std"] }
stellar-strkey     = "0.0.16"
ed25519-dalek      = "2"
sha2               = "0.10"
rand               = "0.8"
tokio              = { version = "1", features = ["full"] }
axum               = { version = "0.8", features = ["macros"] }
tower-http         = { version = "0.6", features = ["cors", "trace"] }
# rmcp 0.15: macros feature is enabled by default. It re-exports schemars as rmcp::schemars.
rmcp               = { version = "0.15", features = ["server", "transport-io"] }
reqwest            = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
base64             = "0.22"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
thiserror          = "2"
dotenvy            = "0.15"

[profile.release]
opt-level        = "z"
overflow-checks  = true
debug            = 0
strip            = "symbols"
debug-assertions = false
panic            = "abort"
codegen-units    = 1
lto              = true

[profile.dev]
overflow-checks = true
